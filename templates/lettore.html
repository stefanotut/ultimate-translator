      let avanti = false;
      tappaVoce('paragrafo finito, cerco il prossimo');
      try { avanti = await prossimoParagrafo(false); } catch (e) { avanti = false; tappaVoce('prossimoParagrafo ERRORE ' + e.message); }
      if (!avanti) {
        const ultimo = !(vista.book?.sections?.[indiceSezione + 1]);
        tappaVoce('fine capitolo, ultimo=' + ultimo);
        const ancora = ultimo ? false : await passaAllaSezioneSuccessiva();
        if (!ancora) { fermaAscolto(ultimo ? 'Libro finito' : 'Capitolo non caricato'); return; }
        try { avanti = await prossimoParagrafo(true, false); } catch (e) { avanti = false; }
        if (!avanti) { fermaAscolto('Libro finito'); return; }
      }
      continue;
    }
    const esito = await suonaFrase();
    if (esito === 'ferma') return;
    // 'salta' significa che l'indice l'ha gia' spostato chi ha premuto il tasto:
    // avanzare di nuovo qui salterebbe due frasi invece di una.
    if (esito !== 'salta') VOCE.i++;
  }
}

// Su iPhone un elemento audio puo' suonare solo se il PRIMO play() parte dentro
// il gesto dell'utente. `load()` non basta: non e' una riproduzione. E il primo
// play() vero arriva solo dopo la risposta del server, cioe' fuori dal gesto.
// Quindi qui si fa partire mezzo decimo di secondo di silenzio, subito, in modo
// sincrono: da quel momento i due elementi sono "sbloccati" per sempre e la voce
// puo' continuare anche a schermo spento, in tasca, in macchina.
function sbloccaAudio() {
  elementiAudio().forEach(a => {
    try {
      a.src = '/static/audio/silenzio-breve.mp3';
      const p = a.play();
      if (p && p.then) p.then(() => { try { a.pause(); } catch (e) {} }).catch(() => {});
    } catch (e) {}
  });
}

// ---- ascolto dei PDF -----------------------------------------------------
// Nel PDF non c'e' foliate: il testo e' uno strato di riquadri trasparenti
// sopra l'immagine della pagina scansionata. Le frasi si ricavano concatenando
// quei riquadri, e l'evidenziazione si disegna sopra i riquadri coperti dalla
// frase in ascolto — la stessa tecnica gia' usata per le sottolineature.

function testoDellaPagina(box) {
  const pezzi = [...box.querySelectorAll('.strato-testo span')];
  let testo = '';
  const mappa = [];
  for (const s of pezzi) {
    const t = s.textContent || '';
    if (!t) continue;
    mappa.push({elemento: s, da: testo.length, a: testo.length + t.length});
    testo += t;
    if (!/\s$/.test(t)) testo += ' ';   // fra un riquadro e l'altro non c'e' spazio
  }
  return {testo, mappa};
}

function dipingiFrasePdf(box, mappa, inizio, fine) {
  box.querySelectorAll('.segno-voce').forEach(e => e.remove());
  const riquadro = box.getBoundingClientRect();
  for (const m of mappa) {
    if (m.a <= inizio || m.da >= fine) continue;
    const r = m.elemento.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'segno segno-voce';
    d.style.left = (r.left - riquadro.left) + 'px';
    d.style.top = (r.top - riquadro.top) + 'px';
    d.style.width = r.width + 'px';
    d.style.height = r.height + 'px';
    box.append(d);
  }
}

async function frasiDellaPaginaPdf(n) {
  const box = document.querySelector('#pdf .pagina[data-n="' + n + '"]');
  if (!box) return null;
  // Se la pagina non e' ancora stata disegnata non ha lo strato di testo:
  // la si porta a vista e si aspetta, invece di saltarla in silenzio.
  for (let attesa = 0; attesa < 30 && !box.querySelector('.strato-testo'); attesa++) {
    if (attesa === 0) box.scrollIntoView();
    await new Promise(r => setTimeout(r, 200));
  }
  const {testo, mappa} = testoDellaPagina(box);
  if (!testo.trim()) return {box, mappa, frasi: []};
  const d = await api('/api/frasi', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({testo}),
  });
  return {box, mappa, frasi: d.frasi || []};
}

async function cicloAscoltoPdf() {
  const mia = VOCE.generazione;
  let n = paginaCorrente || 1;
  while (VOCE.suona && mia === VOCE.generazione) {
    const pagina = await frasiDellaPaginaPdf(n);
    if (!pagina) { fermaAscolto('Libro finito'); return; }
    for (const f of pagina.frasi) {
      if (!VOCE.suona || mia !== VOCE.generazione) return;
      VOCE.frasi = [{mark: null, testo: f.testo}];
      VOCE.i = 0;
      dipingiFrasePdf(pagina.box, pagina.mappa, f.inizio, f.fine);
      salvaPosizione('p' + n, n / pdfDoc.numPages, 'Pagina ' + n);
      const esito = await suonaFrase();
      if (esito === 'ferma') return;
    }
    pagina.box.querySelectorAll('.segno-voce').forEach(e => e.remove());
    n += 1;
    if (n > pdfDoc.numPages) { fermaAscolto('Libro finito'); return; }
    document.querySelector('#pdf .pagina[data-n="' + n + '"]')?.scrollIntoView();
  }
}

// Battito d'ascolto. Ogni minuto il lettore racconta al server dove si trova.
// Serve per un motivo preciso: quando l'ascolto si e' bloccato sul telefono, nel
// registro del server non c'era una sola traccia di che cosa stesse aspettando,
// e la causa e' rimasta un'ipotesi. Ora resta scritto.
let battito = null;
function avviaBattito() {
  clearInterval(battito);
  battito = setInterval(() => {
    if (VOCE.suona) raccontaAscolto('battito');
  }, 60000);
}
function fermaBattito() { clearInterval(battito); battito = null; }

async function avviaAscolto() {
  mostraSpesa();          // il contatore si aggiorna quando cominci
  if (VOCE.suona) return;
  sbloccaAudio();                       // PRIMA di qualunque await: e' il gesto
  VOCE.suona = true;
  VOCE.generazione++;
  $('voce-play').textContent = '⏸';
  avviaBattito();
  if (motore === 'pdf') { cicloAscoltoPdf(); return; }
  try {
    // Ricostruire il TTS azzera il suo iteratore E la mappa dei mark. Se si
    // tengono le frasi di prima, setMark lancia (in silenzio): niente
    // evidenziazione, niente posizione salvata, e finito il paragrafo si
    // riparte dal PRIMO del capitolo. E' il "ripete il capitolo".
    const ttsPrima = vista.tts;
    await preparaTTS(false);        // initTTS non fa nulla se il capitolo e' lo stesso
    if (vista.tts !== ttsPrima) { VOCE.frasi = []; VOCE.i = 0; VOCE.prossimo = null; }
    if (!VOCE.frasi.length) await prossimoParagrafo(true);
  } catch (e) {
    // Dire QUALE errore: un messaggio generico costringe a indovinare, ed e'
    // esattamente cio' che ha fatto perdere ore col lettore bianco.
    fermaAscolto('Ascolto non avviato — ' + (e && e.message ? e.message : e));
    raccontaAlServer('avvio ascolto fallito',
                     (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : e) +
                     ' | ' + (e && e.stack ? String(e.stack).slice(0, 400) : ''));
    return;
  }
  cicloAscolto().catch(e => {
    fermaAscolto('Ascolto interrotto — ' + (e && e.message ? e.message : e));
    raccontaAlServer('ciclo ascolto interrotto', e && e.stack ? String(e.stack).slice(0, 400) : String(e));
  });
}

function fermaAscolto(messaggio) {
  fermaBattito();
  fermaPreparazione();       // niente piu' generazione a pagamento: sei in pausa
  mostraSpesa();
  VOCE.suona = false;
  VOCE.generazione++;
  if (VOCE.interrompi) VOCE.interrompi('ferma');
  elementiAudio().forEach(a => { try { a.pause(); } catch (e) {} });
  $('voce-play').textContent = '▶';
  if (messaggio) statoVoce(messaggio);
  else statoVoce('In pausa');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  salvaSubito();
}

function saltaFrase(passo) {
  // Avanti: la frase corrente e' gia' quella giusta da lasciare, si passa alla
  // successiva. Indietro: si torna a quella prima di quella in corso.
  const nuovo = passo > 0 ? VOCE.i + 1 : VOCE.i - 1;
  VOCE.i = Math.max(0, nuovo);
  elementiAudio().forEach(a => { try { a.pause(); } catch (e) {} });
  if (VOCE.interrompi) VOCE.interrompi('salta');
  else if (VOCE.suona) cicloAscolto();
}

let ultimoCapitoloAnnunciato = null;
function aggiornaMediaSession(frase) {
  if (!('mediaSession' in navigator)) return;
  // Il display dell'auto va aggiornato al cambio di capitolo. Riscriverlo a ogni
  // frase lo fa lampeggiare di continuo e distrae chi guida.
  const capitolo = $('posizione').textContent || 'In lettura';
  if (capitolo === ultimoCapitoloAnnunciato) {
    try { navigator.mediaSession.playbackState = VOCE.suona ? 'playing' : 'paused'; } catch (e) {}
    return;
  }
  ultimoCapitoloAnnunciato = capitolo;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: capitolo,
      artist: {{ titolo|tojson }},
      album: 'Ultimate Translator',
      artwork: [{src: '/api/cover/' + JOB, sizes: '512x512', type: 'image/jpeg'}],
    });
    navigator.mediaSession.playbackState = VOCE.suona ? 'playing' : 'paused';
  } catch (e) {}
}

function collegaMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const h = (nome, fn) => { try { navigator.mediaSession.setActionHandler(nome, fn); } catch (e) {} };
  h('play', () => avviaAscolto());
  h('pause', () => fermaAscolto());
  // Niente 'previoustrack' / 'nexttrack': registrandoli, CarPlay e i comandi al
  // volante smettono di essere "indietro/avanti di poco" e diventano
  // "traccia precedente/successiva". Sul volante c'e' un tasto solo: un tocco
  // in autostrada salterebbe un capitolo intero. Restano i due salti brevi.
  h('seekbackward', () => saltaFrase(-1));
  h('seekforward', () => saltaFrase(1));
}

// ---- pannello della voce -------------------------------------------------
let vociDisponibili = [];
const audioProva = new Audio();

function mostraVoci() {
  $('lista-voci').innerHTML = vociDisponibili.map(v =>
    '<button class="voce-riga' + (v.id === VOCE.voce ? ' on' : '') + '" data-voce="' + v.id + '">' +
      '<span><b>' + esc(v.nome) + '</b>' +
      '<small>' + esc(v.genere) + ' · ' + esc(v.nota) + '</small></span>' +
      '<span class="voce-prova" data-prova="' + v.id + '">▶ prova</span>' +
    '</button>').join('');
  document.querySelectorAll('#lista-voci .voce-riga').forEach(b => {
    b.onclick = ev => {
      const prova = ev.target.closest('[data-prova]');
      if (prova) {
        ev.stopPropagation();
        audioProva.src = '/api/voce/campione/' + prova.dataset.prova;
        audioProva.playbackRate = VOCE.velocita;
        audioProva.play().catch(() => {});
        return;
      }
      VOCE.voce = b.dataset.voce;
      VOCE.cache.clear();               // la voce e' cambiata: l'audio vecchio non vale piu'
      salvaScelteVoce();
      mostraVoci();
    };
  });
}

function salvaScelteVoce() {
  api('/api/book/' + JOB + '/ascolto', {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({voce: VOCE.voce, velocita: VOCE.velocita}),
  });
}

async function caricaVoci() {
  try {
    const d = await api('/api/voci?libro=' + JOB);
    vociDisponibili = d.voci || [];
    VOCE.voce = (d.scelta && d.scelta.voce) || d.predefinita;
    VOCE.velocita = (d.scelta && d.scelta.velocita) || 1;
    $('voce-cursore').value = VOCE.velocita;
    aggiornaEtichettaVelocita();
    if (!d.disponibile) {
      statoVoce('Manca la chiave OpenAI: nessuna voce');
      $('voce-play').disabled = true;
    }
    // Dire sempre quale motore sta parlando e se costa: sapere di stare
    // spendendo (o di non spendere) non deve essere una deduzione.
    const t = d.tetto || {};
    $('voce-nota').textContent = d.gratis
      ? 'Voce sul tuo Mac: gratis, funziona anche senza rete.'
      : 'Voce a pagamento (OpenAI). Oggi hai usato ' +
        Math.round((t.usati || 0) / 1000) + ' mila caratteri su ' +
        Math.round((t.massimo || 0) / 1000) + '. Riascoltare non costa nulla.';
    mostraVoci();
  } catch (e) {
    statoVoce('Voci non caricate');
  }
}

function aggiornaEtichettaVelocita() {
  const t = VOCE.velocita.toFixed(1).replace('.', ',') + '×';
  $('voce-velocita').textContent = t;
  $('voce-cursore-val').textContent = t;
  elementiAudio().forEach(a => { a.playbackRate = VOCE.velocita; });
}

function apriAscolto() {
  VOCE.acceso = true;
  $('barra-basso').hidden = true;
  $('barra-voce').hidden = false;
  $('btn-ascolta').classList.add('attivo');
  collegaMediaSession();
  if (!vociDisponibili.length) caricaVoci();
}

function chiudiAscolto() {
  fermaAscolto('');
  VOCE.acceso = false;
  $('barra-voce').hidden = true;
  $('barra-basso').hidden = false;
  $('btn-ascolta').classList.remove('attivo');
  try {
    const doc = vista?.renderer?.getContents?.()[0]?.doc;
    doc?.defaultView?.CSS?.highlights?.delete('voce');
  } catch (e) {}
  document.querySelectorAll('.segno-voce').forEach(e => e.remove());
}

$('btn-ascolta').onclick = () => (VOCE.acceso ? chiudiAscolto() : apriAscolto());
$('voce-play').onclick = () => (VOCE.suona ? fermaAscolto('') : avviaAscolto());
$('voce-avanti').onclick = () => saltaFrase(1);
$('voce-indietro').onclick = () => saltaFrase(-1);
$('voce-chiudi').onclick = () => chiudiAscolto();
$('voce-scelta').onclick = () => apri('pan-voce');

// "Ascolta da qui": si tiene il punto scelto dall'utente e si fa ripartire la
// voce da li'. E' l'unico modo per dire "riprendi da questa frase" senza dover
// saltare avanti a mano una frase alla volta.
async function ascoltaDaQui() {
  nascondiFumetto();
  try {
    if (motore === 'pdf') {
      // Nel PDF il punto e' una pagina: si riparte da quella che si sta guardando.
      if (!VOCE.acceso) apriAscolto();
      fermaAscolto('');
      await new Promise(r => setTimeout(r, 60));
      avviaAscolto();
      return;
    }
    const doc = vista.renderer.getContents()[0].doc;
    const sel = doc.getSelection();
    if (!sel || !sel.rangeCount) return;
    const punto = sel.getRangeAt(0).cloneRange();
    sel.removeAllRanges();                 // via la selezione: ora comanda la voce

    if (!VOCE.acceso) apriAscolto();
    const stavaSuonando = VOCE.suona;
    if (stavaSuonando) fermaAscolto('');
    sbloccaAudio();                        // siamo ancora dentro il gesto del tocco
    await preparaTTS(true);
    const ssml = vista.tts.from(punto);
    if (!ssml) { statoVoce('Non riesco a partire da qui'); return; }
    VOCE.frasi = frasiDaSSML(ssml);
    VOCE.i = 0;
    VOCE.suona = true;
    VOCE.generazione++;
    $('voce-play').textContent = '⏸';
    cicloAscolto();
  } catch (e) {
    statoVoce('Non riesco a partire da qui');
  }
}
$('fum-ascolta').onclick = ascoltaDaQui;
// La velocita' e' il comando che si tocca piu' spesso, e in macchina si tocca
// senza guardare: un cursore dentro un pannello non va bene. Qui il tasto cicla
// fra i valori utili e l'effetto e' immediato, anche a meta' frase.
const VELOCITA = [1, 1.2, 1.5, 1.8, 2, 0.8];
$('voce-velocita').onclick = () => {
  const i = VELOCITA.findIndex(v => Math.abs(v - VOCE.velocita) < 0.01);
  VOCE.velocita = VELOCITA[(i + 1) % VELOCITA.length];
  $('voce-cursore').value = VOCE.velocita;
  aggiornaEtichettaVelocita();
  salvaScelteVoce();
};
$('voce-cursore').oninput = e => {
  VOCE.velocita = parseFloat(e.target.value) || 1;
  aggiornaEtichettaVelocita();
};
$('voce-cursore').onchange = () => salvaScelteVoce();

// Se la scheda finisce in secondo piano l'audio continua (e' il punto: si
// ascolta col telefono in tasca), ma la posizione va messa al sicuro subito.
addEventListener('pagehide', () => { if (VOCE.suona) salvaSubito(); });

let qualcosaMostrato = false;
function segnaMostrato() {
  qualcosaMostrato = true;
  // Se il guardiano aveva gia' scritto "il libro non si e' aperto" e il libro
  // poi si apre lo stesso (caricamento lento, non guasto), quel messaggio deve
  // sparire: restava appiccicato sopra il testo, dicendo il falso.
  document.querySelectorAll('#zona > .vuoto').forEach(e => e.remove());
}

// Racconta al server lo stato interno quando il libro non compare: e' l'unico
// modo per capire la causa senza chiedere all'utente di fare da tecnico.
function raccontaAlServer(motivo, errore) {
  try {
    const z = document.getElementById('zona');
    const r = vista?.renderer;
    navigator.sendBeacon('/api/diagnostica', new Blob([JSON.stringify({
      motivo, errore: errore ? String(errore) : null,
      libro: JOB, formato: FORMATO,
      browser: navigator.userAgent,
      finestra: innerWidth + 'x' + innerHeight,
      zona: z ? z.clientWidth + 'x' + z.clientHeight : null,
      elementoDefinito: !!customElements.get('foliate-view'),
      renderer: r ? r.tagName : null,
      rendererDim: r ? r.clientWidth + 'x' + r.clientHeight : null,
      sezioni: vista?.book?.sections?.length ?? null,
      flusso: r ? r.getAttribute('flow') : null,
      tema: PREF.tema, corpo: PREF.dim, colonne: PREF.col,
      tappe: TAPPE.join(' | '),
      // Un'estensione che sostituisce il costruttore Blob ha tenuto il lettore
      // bianco per ore senza lasciare un solo errore: ora lo si vede subito.
      blobManomesso: (function () {
        try { return !/\[native code\]/.test(String(Blob)); } catch (e) { return null; }
      })(),
      capitoloNonCaricato: guastoSezione,
    })], {type: 'application/json'}));
  } catch (e) { /* la diagnosi non deve mai essa stessa rompere la pagina */ }
}

function mostraGuasto(motivo, dettaglio) {
  if (qualcosaMostrato) return;
  const zona = $('zona');
  if (zona.querySelector(':scope > .vuoto')) return;    // gia' mostrato
  const avviso = document.createElement('div');
  avviso.innerHTML =
    '<div class="vuoto" style="padding:110px 24px 0;max-width:520px;margin:0 auto">' +
      '<div style="font-size:44px;margin-bottom:14px">📖</div>' +
      '<div style="font-size:16px;color:var(--inchiostro);margin-bottom:10px">' +
        esc(motivo) + '</div>' +
      (dettaglio ? '<div style="font-size:12.5px;opacity:.75;margin-bottom:20px;' +
        'word-break:break-word">' + esc(dettaglio) + '</div>' : '') +
      '<button class="scelta" onclick="location.reload(true)">Riprova</button> ' +
      '<a class="scelta" style="text-decoration:none;display:inline-block" ' +
         'href="/api/download/' + JOB + '">Scarica il file</a> ' +
      '<a class="scelta" style="text-decoration:none;display:inline-block" ' +
         'href="/libreria">Torna ai libri</a>' +
    '</div>';
  // Se il PDF sta ancora arrivando, il suo contenitore resta: l'avviso gli va
  // sopra, e sparisce da solo alla prima pagina disegnata (segnaMostrato).
  if (zona.querySelector('#pdf')) zona.prepend(avviso.firstChild);
  else { zona.innerHTML = ''; zona.append(avviso.firstChild); }
}

(async function () {
  // Se il modulo non arriva (rete, cache vecchia, browser che non regge i
  // moduli ES) il guardiano lo dice invece di lasciare il bianco.
  // Scatta dopo 12 secondi di SILENZIO (nessuna tappa, nessun byte scaricato),
  // non 12 secondi dopo l'apertura: un libro grande che sta arrivando non e'
  // un guasto.
  const guardiano = setInterval(() => {
    if (qualcosaMostrato) { clearInterval(guardiano); return; }
    if (Date.now() - ultimaVita < 12000) return;
    clearInterval(guardiano);
    raccontaAlServer('12s senza segni di vita: apertura non conclusa');
    mostraGuasto(
    'Il libro non si è aperto.',
    'Prova a ricaricare tenendo premuto il tasto di aggiornamento, oppure ' +
    'scarica il file e leggilo con l\'app che preferisci.');
  }, 1000);

  try {
    if (FORMATO === 'epub') await avviaEpub();
    else if (FORMATO === 'pdf') await avviaPdf();
    else {
      clearInterval(guardiano); segnaMostrato();
      $('zona').innerHTML = '<div class="vuoto" style="padding-top:120px">' +
        'Il lettore integrato copre EPUB e PDF.<br>Per questo formato usa il download.</div>';
      return;
    }
    clearInterval(guardiano);
    if (!qualcosaMostrato && FORMATO === 'epub') {
      // Caricato ma non disegnato: prima di arrendersi si prova a forzare la
      // prima pagina. Su alcuni browser il primo rendering non parte da solo.
      await new Promise(r => setTimeout(r, 1000));
      if (!qualcosaMostrato) { try { await vista.renderer?.next(); } catch (e) {} }

      // Ultimo ripiego: passare allo SCORRIMENTO, che usa un percorso di
      // rendering diverso. Non e' piu' la cura del guasto noto (era
      // un'estensione che sostituiva il costruttore Blob, vedi
      // static/vendor/foliate/blob-sicuro.js), ma resta la rete di sicurezza
      // per qualunque problema del solo impaginato a colonne.
      await new Promise(r => setTimeout(r, 900));
      if (!qualcosaMostrato) {
        try {
          // Solo per questa sessione: un ripiego automatico non deve cambiare
          // in modo permanente una scelta che l'utente non ha mai fatto. E'
          // successo davvero — dopo un guasto il lettore e' rimasto in
          // scorrimento anche una volta riparato, e sembrava un secondo difetto.
          vista.renderer.setAttribute('flow', 'scrolled');
          await vista.init({ showTextStart: true });
        } catch (e) { /* si prosegue verso la segnalazione */ }
      }

      await new Promise(r => setTimeout(r, 1600));
      if (qualcosaMostrato) {
        raccontaAlServer('recuperato passando allo scorrimento');
      } else {
        raccontaAlServer('nessun rendering nemmeno in scorrimento');
        mostraGuasto('Il libro si è caricato ma non si vede.',
          'Ho mandato la diagnosi al server. Intanto puoi scaricare il file.');
      }
    }
  } catch (err) {
    clearInterval(guardiano);
    console.error(err);
    raccontaAlServer('eccezione in avvio', err && (err.stack || err.message));
    mostraGuasto('Non riesco ad aprire il libro.',
                 (err && err.message) ? err.message : String(err));
  }
})();
</script>
