<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Appunti — Ultimate Translator</title>
<style>
  :root{
    --bg:#080412; --panel:#140b26; --panel-2:#1a1030; --line:#2a1b45;
    --text:#F1EEFF; --muted:#9d8fc4; --accent:#7C3AED; --accent-2:#A78BFA;
    --info:#06B6D4;
  }
  *{box-sizing:border-box}
  body{margin:0; min-height:100dvh; padding:0 16px 70px;
    background:radial-gradient(1200px 600px at 50% -10%, #1e1040 0%, var(--bg) 60%);
    background-attachment:fixed; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif}
  .wrap{max-width:820px; margin:0 auto}
  .ut-nav{position:sticky; top:0; z-index:50; display:flex; gap:8px; justify-content:center;
    padding:10px 12px; margin:0 -16px 18px; background:rgba(8,4,18,.85);
    backdrop-filter:blur(14px); border-bottom:1px solid var(--line)}
  .ut-tab{display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px;
    color:var(--muted); font-size:15px; font-weight:600; text-decoration:none;
    border:1px solid transparent; white-space:nowrap}
  .ut-tab.on{color:var(--text); background:var(--panel-2); border-color:var(--line)}
  h1{font-size:23px; margin:0 0 16px}
  #q{width:100%; padding:12px 14px; font-size:16px; background:#0d0720; color:var(--text);
     border:1px solid var(--line); border-radius:11px; outline:none; font-family:inherit;
     margin-bottom:16px}
  #q:focus{border-color:var(--accent-2)}
  .voce{background:var(--panel); border:1px solid var(--line); border-radius:14px;
        padding:15px 16px; margin-bottom:11px}
  .brano{border-left:3px solid #ffd640; padding-left:12px; font-size:15px; line-height:1.55;
         font-family:Georgia,serif}
  .nota{margin-top:10px; font-size:13.5px; color:var(--muted); line-height:1.5}
  .meta{margin-top:11px; font-size:12px; color:var(--muted); display:flex; gap:10px;
        flex-wrap:wrap; align-items:center}
  .meta a{color:var(--accent-2); text-decoration:none; font-weight:600}
  .btn{padding:6px 11px; border-radius:9px; border:1px solid var(--line); background:none;
       color:var(--muted); font-size:12px; cursor:pointer; font-family:inherit}
  .vuoto{text-align:center; color:var(--muted); padding:70px 20px; line-height:1.7}
  .foot{text-align:center; color:var(--muted); font-size:12px; margin-top:22px}
</style>
</head>
<body>
<nav class="ut-nav">
  <a href="/" class="ut-tab">✍️ <span>Traduci</span></a>
  <a href="/libreria" class="ut-tab">📚 <span>I miei libri</span></a>
  <a href="/appunti" class="ut-tab on">✎ <span>Appunti</span></a>
</nav>

<div class="wrap">
  <h1>Appunti e evidenziazioni</h1>
  <input id="q" type="search" placeholder="Cerca nei brani e nelle note..." autocomplete="off">
  <div id="lista"></div>
  <p class="foot" id="foot"></p>
</div>

<script>
(function(){const f=window.fetch.bind(window);window.fetch=async(...a)=>{
  const r=await f(...a); if(r.status===401){location.href='/login';throw new Error('x');} return r;};})();

const lista=document.getElementById('lista'), foot=document.getElementById('foot'),
      qEl=document.getElementById('q');
const LIBRO=new URLSearchParams(location.search).get('libro');
let voci=[];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function titoloPulito(n){return String(n||'').replace(/\.[a-z0-9]+$/i,'')
  .replace(/\((?:[^()]*(?:z-lib|1lib|z-library)[^()]*)\)/gi,'')
  .replace(/_tradotto_\w+$/i,'').replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').trim();}
function quando(ts){const d=new Date(ts*1000);
  return d.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});}

async function carica(){
  const p=new URLSearchParams();
  if(qEl.value.trim()) p.set('q',qEl.value.trim());
  const d=await (await fetch('/api/annotations?'+p)).json();
  voci=(d.annotations||[]).filter(v=>!LIBRO||v.job_id===LIBRO);
  lista.innerHTML = voci.length ? voci.map(v=>`
    <div class="voce">
      <div class="brano" style="border-left-color:${esc(v.color)}">${esc(v.text)}</div>
      ${v.note?`<div class="nota">📝 ${esc(v.note)}</div>`:''}
      <div class="meta">
        <a href="/leggi/${v.job_id}">${esc(titoloPulito(v.book_title))}</a>
        ${v.chapter?'· '+esc(v.chapter):''} · ${quando(v.created_at)}
        <button class="btn" data-copia="${v.id}">Copia</button>
        <button class="btn" data-elimina="${v.id}">Elimina</button>
      </div>
    </div>`).join('')
    : `<div class="vuoto">${qEl.value.trim()?'Nessun risultato.':
        'Ancora nessuna evidenziazione.<br>Aprine uno dalla libreria e seleziona del testo mentre leggi.'}</div>`;
  foot.textContent = voci.length ? voci.length+' evidenziazioni' : '';
}

lista.addEventListener('click', async (e)=>{
  const b=e.target.closest('button'); if(!b) return;
  const v=voci.find(x=>x.id===(b.dataset.copia||b.dataset.elimina)); if(!v) return;
  if(b.dataset.copia){
    navigator.clipboard?.writeText(v.text+(v.note?'\n\n— '+v.note:''));
    b.textContent='Copiato'; setTimeout(()=>b.textContent='Copia',1200);
  }
  if(b.dataset.elimina && confirm('Eliminare questa evidenziazione?')){
    await fetch('/api/annotations/'+v.id,{method:'DELETE'}); carica();
  }
});

let deb=null;
qEl.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(carica,250);});
carica();
</script>
</body>
</html>
