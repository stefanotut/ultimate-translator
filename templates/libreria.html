<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>I miei libri — Ultimate Translator</title>
<style>
  :root{
    --bg:#080412; --panel:#140b26; --panel-2:#1a1030; --line:#2a1b45;
    --text:#F1EEFF; --muted:#9d8fc4;
    --accent:#7C3AED; --accent-2:#A78BFA;
    --ok:#34D399; --err:#F87171; --warn:#FBBF24; --info:#06B6D4;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; padding:0 16px 70px;
    background:radial-gradient(1200px 600px at 50% -10%, #1e1040 0%, var(--bg) 60%);
    background-attachment:fixed; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
  }
  .wrap{max-width:1080px; margin:0 auto}

  .ut-nav{
    position:sticky; top:0; z-index:50; display:flex; gap:8px; justify-content:center;
    padding:10px 12px; margin:0 -16px 18px;
    background:rgba(8,4,18,.85); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .ut-tab{
    display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:12px;
    color:var(--muted); font-size:15px; font-weight:600; text-decoration:none;
    border:1px solid transparent; white-space:nowrap;
  }
  .ut-tab.on{color:var(--text); background:var(--panel-2); border-color:var(--line)}
  .ut-tab:hover{color:var(--text)}
  #nav-badge:not(:empty){background:var(--info); color:#04121a; font-size:11px;
    font-weight:800; padding:2px 8px; border-radius:999px; min-width:20px; text-align:center}

  header{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap}
  h1{font-size:23px; margin:0; letter-spacing:-.02em; flex:1}
  .btn{padding:10px 16px; border-radius:11px; border:1px solid var(--line);
       background:var(--panel); color:var(--text); font-size:14px; font-weight:600;
       cursor:pointer; text-decoration:none; display:inline-block; font-family:inherit}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); border:0}

  .tools{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap}
  #q{flex:1; min-width:200px; padding:12px 14px; font-size:16px; background:#0d0720;
     color:var(--text); border:1px solid var(--line); border-radius:11px; outline:none;
     font-family:inherit}
  #q:focus{border-color:var(--accent-2)}
  .chip{padding:9px 14px; border-radius:999px; border:1px solid var(--line);
        background:var(--panel); color:var(--muted); font-size:13px; cursor:pointer;
        font-family:inherit; white-space:nowrap}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}

  /* ---- scaffale ---- */
  .scaffale{
    display:grid; gap:22px 18px;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  }
  @media (max-width:420px){ .scaffale{grid-template-columns:repeat(2, 1fr); gap:18px 14px} }

  .libro{cursor:pointer; position:relative}
  .cop{
    position:relative; width:100%; aspect-ratio:2/3; border-radius:8px; overflow:hidden;
    background:linear-gradient(160deg,#241640,#140b26);
    box-shadow:0 10px 24px rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.4);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .libro:hover .cop{transform:translateY(-4px); box-shadow:0 16px 32px rgba(0,0,0,.6)}
  .cop img{width:100%; height:100%; object-fit:cover; display:block}
  .cop::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(90deg, rgba(0,0,0,.30) 0 3px, rgba(255,255,255,.07) 5px, transparent 12px)}

  .stato{
    position:absolute; top:7px; right:7px; font-size:10.5px; font-weight:800;
    padding:4px 8px; border-radius:999px; letter-spacing:.02em;
  }
  .s-running{background:rgba(6,182,212,.9); color:#04121a}
  .s-pending{background:rgba(251,191,36,.9); color:#241a00}
  .s-error{background:rgba(248,113,113,.92); color:#2a0000}
  .s-canceled{background:rgba(157,143,196,.9); color:#12091f}

  .avanz{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(0,0,0,.45)}
  .avanz i{display:block; height:100%; background:var(--accent-2)}

  .tit{font-size:13px; font-weight:600; margin:9px 0 3px; line-height:1.32;
       display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .sub{font-size:11.5px; color:var(--muted); line-height:1.45}

  .lavoro{margin-top:6px}
  .lavoro .barra{height:5px; background:#0d0720; border-radius:99px; overflow:hidden}
  .lavoro .barra i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2))}

  .vuoto{text-align:center; color:var(--muted); padding:70px 20px; line-height:1.7;
         grid-column:1/-1}
  .foot{text-align:center; color:var(--muted); font-size:12px; margin-top:28px}

  /* ---- scheda libro ---- */
  .velo{position:fixed; inset:0; background:rgba(4,2,10,.72); backdrop-filter:blur(6px);
        z-index:60; display:none; align-items:center; justify-content:center; padding:20px}
  .velo.on{display:flex}
  .scheda{background:var(--panel); border:1px solid var(--line); border-radius:18px;
          max-width:420px; width:100%; padding:22px; max-height:88vh; overflow-y:auto}
  .scheda h2{font-size:17px; margin:0 0 4px; line-height:1.35}
  .scheda .sub{margin-bottom:16px}
  .azioni{display:flex; flex-direction:column; gap:9px; margin-top:16px}
  .azioni .btn{text-align:center}
</style>
</head>
<body>

<nav class="ut-nav">
  <a href="/" class="ut-tab">✍️ <span>Traduci</span></a>
  <a href="/libreria" class="ut-tab on">📚 <span>I miei libri</span><b id="nav-badge"></b></a>
  <a href="/appunti" class="ut-tab">✎ <span>Appunti</span></a>
</nav>

<div class="wrap">
  <header>
    <h1>I miei libri</h1>
    <div style="display:flex; gap:8px; flex-wrap:wrap">
      <!-- Due strade per far entrare un libro: farlo tradurre, oppure metterci
           dentro uno che si ha gia'. La seconda e' cio' che rende questa una
           libreria e non solo la coda di un traduttore. -->
      <button class="btn" id="btn-importa" title="Metti in libreria un libro che hai gia', senza tradurlo">
        + Aggiungi un libro che ho gia'
      </button>
      <button class="btn" id="btn-audio" title="Crea l'audiolibro dei libri che non ce l'hanno">
        🎧 Crea audio mancanti
      </button>
      <a class="btn primary" href="/">+ Traduci un nuovo libro</a>
    </div>
  </header>
  <input type="file" id="file-importa" multiple
         accept=".epub,.pdf,.docx,.txt,.md" style="display:none">
  <div id="esito-importa" style="display:none; margin:0 0 14px; padding:11px 14px;
       border-radius:11px; font-size:13.5px; line-height:1.5"></div>

  <div class="tools">
    <input id="q" type="search" placeholder="Cerca un libro per titolo..." autocomplete="off">
    <div class="filters" id="filters" style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="chip on" data-status="">Tutti</button>
      <button class="chip" data-status="active">In corso</button>
      <button class="chip" data-status="done">Completati</button>
      <button class="chip" data-status="error">Errori</button>
    </div>
  </div>

  <div class="scaffale" id="scaffale"></div>
  <p class="foot" id="foot"></p>
</div>

<div class="velo" id="velo"><div class="scheda" id="scheda"></div></div>

<script>
(function () {
  const f = window.fetch.bind(window);
  window.fetch = async (...a) => {
    const r = await f(...a);
    if (r.status === 401) { location.href = '/login'; throw new Error('scaduta'); }
    return r;
  };
})();

const $ = (id) => document.getElementById(id);
const scaffale = $('scaffale'), foot = $('foot'), qEl = $('q');
let status = '', timer = null, chiave = '', libri = [];

const ETICHETTA = {pending:'In coda', running:'In corso', completed:'Completato',
                   error:'Errore', canceled:'Annullato'};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function quando(ts){
  if(!ts) return '';
  const d=new Date(ts*1000), diff=(Date.now()-d)/1000;
  if(diff<60) return 'adesso';
  if(diff<3600) return Math.floor(diff/60)+' min fa';
  if(diff<86400) return Math.floor(diff/3600)+' ore fa';
  if(diff<172800) return 'ieri';
  return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
}

function titoloPulito(nome){
  // I file scaricati portano dietro mezzo indirizzo del sito: si toglie.
  return String(nome||'').replace(/\.[a-z0-9]+$/i,'')
    .replace(/\((?:[^()]*(?:z-lib|1lib|z-library|annas-archive)[^()]*)\)/gi,'')
    .replace(/_tradotto_\w+$/i,'')
    .replace(/[_]+/g,' ').replace(/\s{2,}/g,' ').trim();
}

function scheda(j){
  const leggibile = j.readable && j.status === 'completed';
  const letto = Math.round((j.read_percent||0)*100);
  const lavoro = (j.status==='running'||j.status==='pending');
  return `
  <div class="libro" data-id="${j.task_id}">
    <div class="cop">
      ${j.status==='completed'
        ? `<img loading="lazy" src="/api/cover/${j.task_id}" alt="">`
        : ``}
      ${j.status!=='completed'
        ? `<span class="stato s-${j.status}">${ETICHETTA[j.status]||j.status}</span>` : ``}
      ${leggibile && letto>0 ? `<div class="avanz"><i style="width:${letto}%"></i></div>` : ``}
    </div>
    <div class="tit">${esc(titoloPulito(j.original_filename))}</div>
    <div class="sub">
      ${(j.file_type||'').toUpperCase()}
      ${j.importato ? ' · aggiunto da te' : ''}
      ${j.audio && j.audio.stato === 'pronto' ? ` · 🎧 ${j.audio.minuti} min` : ''}
      ${j.audio && j.audio.stato === 'in_corso' ? ` · 🎧 ${j.audio.fatti}/${j.audio.capitoli}` : ''}
      ${j.audio && j.audio.stato === 'in_coda' ? ' · 🎧 in coda' : ''}
      ${leggibile && letto>0 ? ` · letto ${letto}%` : ''}
      ${j.annotations ? ` · ✎ ${j.annotations}` : ''}
      ${!leggibile ? ' · ' + quando(j.created_at) : ''}
    </div>
    ${j.status==='completed' && j.file_presente===false
      ? `<div class="sub" style="color:#ffb3b3">file non piu' disponibile — da rifare</div>` : ``}
    ${lavoro ? `<div class="lavoro"><div class="barra"><i style="width:${Math.round((j.progress||0)*100)}%"></i></div>
       <div class="sub" style="margin-top:4px">${Math.round((j.progress||0)*100)}% — ${esc(j.status_text||'')}</div></div>` : ``}
  </div>`;
}

async function carica(){
  const p = new URLSearchParams();
  if (qEl.value.trim()) p.set('q', qEl.value.trim());
  if (status) p.set('status', status);
  const d = await (await fetch('/api/jobs?'+p)).json();
  libri = d.jobs || [];
  const c = d.counts || {};

  const k = JSON.stringify(libri.map(j=>[j.task_id,j.status,j.progress,j.read_percent,j.annotations]));
  if (k !== chiave) {
    chiave = k;
    scaffale.innerHTML = libri.length ? libri.map(scheda).join('')
      : `<div class="vuoto">Nessun libro qui.<br>${qEl.value.trim()
          ? 'Prova con un altro titolo.'
          : 'Fallo tradurre, oppure aggiungi un libro che hai gia\'.'}</div>`;
  }
  foot.textContent = `${c.active||0} in traduzione · ${c.completed||0} pronti · ${c.total||0} in totale`;
  const b = $('nav-badge'); if (b) b.textContent = (c.active||0) > 0 ? c.active : '';

  clearTimeout(timer);
  timer = setTimeout(carica, (c.active||0) > 0 ? 3000 : 20000);
}

// ---- aggiungere un libro che si ha gia', senza tradurlo -------------------
const fileImporta = $('file-importa');
const esitoImporta = $('esito-importa');

function messaggioImporta(testo, colore) {
  esitoImporta.style.display = 'block';
  esitoImporta.style.background = colore === 'ko' ? 'rgba(220,60,60,.14)' : 'rgba(124,58,237,.14)';
  esitoImporta.style.color = colore === 'ko' ? '#ffb3b3' : 'inherit';
  esitoImporta.innerHTML = testo;
}

$('btn-importa').onclick = () => fileImporta.click();

$('btn-audio').onclick = async () => {
  const b = $('btn-audio');
  b.disabled = true; const prima = b.textContent; b.textContent = 'Metto in coda…';
  try {
    const r = await fetch('/api/audiolibri', {method: 'POST'});
    const d = await r.json();
    const s = await (await fetch('/api/audiolibri')).json();
    // Si dice quanto ci vorra': la voce gira su questo Mac, non e' istantanea.
    const ore = Math.round((s.in_coda || 0) * 2);
    messaggioImporta(
      d.accodati
        ? '<b>' + d.accodati + (d.accodati === 1 ? ' libro' : ' libri') + '</b> in coda per l\'audio. ' +
          'Si fanno uno alla volta in sottofondo, circa 2 ore di Mac per libro' +
          (ore ? ' (in tutto ~' + ore + ' ore)' : '') + '. Puoi chiudere la pagina.' +
          (d.avviso ? '<br>' + esc(d.avviso) : '')
        : 'Tutti i libri hanno gia\' l\'audio o sono gia\' in coda.',
      d.avviso ? 'ko' : 'ok');
  } catch (e) {
    messaggioImporta('Non sono riuscito a mettere in coda: ' + esc(e.message || e), 'ko');
  }
  b.disabled = false; b.textContent = prima;
  chiave = null; carica();
};

fileImporta.onchange = async () => {
  const scelti = [...fileImporta.files];
  fileImporta.value = '';                      // cosi' si puo' ricaricare lo stesso file
  if (!scelti.length) return;

  const fatti = [], falliti = [];
  for (let i = 0; i < scelti.length; i++) {
    const f = scelti[i];
    messaggioImporta('Carico <b>' + esc(f.name) + '</b>… (' + (i+1) + ' di ' + scelti.length + ')');
    const modulo = new FormData();
    modulo.append('file', f);
    try {
      const r = await fetch('/api/importa', {method: 'POST', body: modulo});
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('errore ' + r.status));
      fatti.push(f.name);
    } catch (e) {
      // Un file che non entra non deve fermare gli altri, ma nemmeno sparire
      // in silenzio: si dice quale e perche'.
      falliti.push(esc(f.name) + ' — ' + esc(e.message || 'non caricato'));
    }
  }

  let testo = '';
  if (fatti.length) testo += '<b>' + fatti.length + (fatti.length === 1 ? ' libro aggiunto' : ' libri aggiunti')
                             + '</b> alla libreria.';
  if (falliti.length) testo += (testo ? '<br>' : '') + 'Non caricati: ' + falliti.join('<br>');
  messaggioImporta(testo || 'Niente da caricare.', falliti.length && !fatti.length ? 'ko' : 'ok');
  chiave = null;                               // forza il ridisegno dello scaffale
  carica();
};

// ---- audiolibro: mettere in coda, e ascoltare le tracce gia' pronte --------
document.addEventListener('click', async (e) => {
  const c = e.target.closest('[data-creaudio]');
  if (c) {
    c.disabled = true; c.textContent = 'Metto in coda…';
    try {
      await fetch('/api/audiolibro/' + c.dataset.creaudio, {method:'POST'});
      c.textContent = '🎧 In coda';
      chiave = null; carica();
    } catch (err) { c.disabled = false; c.textContent = '🎧 Crea l\'audiolibro'; }
    return;
  }
  const a = e.target.closest('[data-audio]');
  if (!a) return;
  const id = a.dataset.audio;
  const box = $('lettore-audio');
  box.innerHTML = 'Carico le tracce…';
  try {
    const d = await (await fetch('/api/audiolibro/' + id)).json();
    const tracce = d.tracce || [];
    if (!tracce.length) { box.textContent = 'Nessuna traccia pronta.'; return; }
    // Un lettore essenziale: una traccia dopo l'altra, senza fronzoli. Serve a
    // sentire subito che l'audio c'e' ed e' giusto; per l'ascolto vero c'e' il
    // lettore del libro, che segue anche il testo.
    box.innerHTML =
      '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">' +
        tracce.length + ' tracce · ' + d.minuti + ' minuti · voce ' + esc(d.voce||'') + '</div>' +
      '<audio id="ap" controls style="width:100%"></audio>' +
      '<div id="elenco-tracce" style="max-height:190px;overflow:auto;margin-top:8px"></div>';
    const ap = $('ap');
    const elenco = $('elenco-tracce');
    elenco.innerHTML = tracce.map((t,i) =>
      `<button class="btn" data-traccia="${i}" style="display:block;width:100%;text-align:left;
         margin:0 0 4px;font-size:12.5px">${i+1}. ${Math.round(t.secondi/60)} min</button>`).join('');
    let corrente = -1;
    const suona = i => {
      if (i < 0 || i >= tracce.length) return;
      corrente = i;
      ap.src = '/api/audiolibro/' + id + '/' + tracce[i].file;
      ap.play().catch(()=>{});
      [...elenco.children].forEach((b,k) => b.style.background = k===i ? 'rgba(124,58,237,.25)' : '');
    };
    elenco.onclick = ev => { const b = ev.target.closest('[data-traccia]'); if (b) suona(+b.dataset.traccia); };
    ap.onended = () => suona(corrente + 1);      // il libro va avanti da solo
    suona(0);
  } catch (err) {
    box.textContent = 'Non riesco a caricare le tracce: ' + (err.message || err);
  }
});

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-elimina]');
  if (!b) return;
  const id = b.dataset.elimina;
  const libro = libri.find(x => x.task_id === id);
  const note = libro && libro.annotations ? ' e le sue ' + libro.annotations + ' evidenziazioni' : '';
  // Conferma esplicita: e' l'unica cosa nel portale che cancella davvero.
  if (!confirm('Togliere «' + titoloPulito(libro ? libro.original_filename : '') +
               '» dalla libreria?\n\nVengono eliminati il file' + note +
               '. Non si puo\' annullare.')) return;
  b.disabled = true; b.textContent = 'Elimino…';
  try {
    const r = await fetch('/api/libro/' + id, {method: 'DELETE'});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('errore ' + r.status));
    $('velo').classList.remove('on');
    chiave = null; carica();
  } catch (err) {
    b.disabled = false; b.textContent = 'Togli dalla libreria';
    alert('Non eliminato: ' + (err.message || err));
  }
});

scaffale.addEventListener('click', (e) => {
  const el = e.target.closest('.libro'); if (!el) return;
  const j = libri.find(x => x.task_id === el.dataset.id); if (!j) return;
  const leggibile = j.readable && j.status === 'completed';
  const letto = Math.round((j.read_percent||0)*100);
  $('scheda').innerHTML = `
    <h2>${esc(titoloPulito(j.original_filename))}</h2>
    <div class="sub">${(j.file_type||'').toUpperCase()} · verso ${esc(j.target_lang)}
      · ${esc(j.model)} · ${quando(j.created_at)}</div>
    ${j.status==='error' && j.error ? `<div class="sub" style="color:var(--err)">${esc(j.error)}</div>`:''}
    ${leggibile && letto>0 ? `<div class="sub">Sei al ${letto}%${j.read_label?' — '+esc(j.read_label):''}</div>`:''}
    <div class="azioni">
      ${leggibile ? `<a class="btn primary" href="/leggi/${j.task_id}">
          ${letto>0 ? '▶ Riprendi la lettura' : '▶ Leggi'}</a>` : ''}
      ${j.status === 'running' || j.status === 'queued'
        ? `<a class="btn" href="/ascolta/${j.task_id}">🎧 Ascolta mentre traduce</a>` : ''}
      ${j.status==='completed' ? `<a class="btn" href="/api/download/${j.task_id}">⬇ Scarica il file</a>`:''}
      ${j.annotations ? `<a class="btn" href="/appunti?libro=${j.task_id}">✎ ${j.annotations} evidenziazioni</a>`:''}
      ${(j.status==='running'||j.status==='pending')
        ? `<button class="btn" data-annulla="${j.task_id}">Annulla traduzione</button>`:''}
      ${j.audio && j.audio.stato==='pronto'
        ? `<button class="btn" data-audio="${j.task_id}">🎧 Ascolta l'audiolibro</button>`:''}
      ${j.status==='completed' && (!j.audio || j.audio.stato==='assente' || j.audio.stato==='errore')
        && (j.file_type==='epub'||j.file_type==='pdf')
        ? `<button class="btn" data-creaudio="${j.task_id}">🎧 Crea l'audiolibro</button>`:''}
      ${(j.status!=='running'&&j.status!=='pending')
        ? `<button class="btn" data-elimina="${j.task_id}"
             style="margin-left:auto;color:#ffb3b3">Togli dalla libreria</button>`:''}
    </div>
    <div id="lettore-audio" style="margin-top:12px"></div>`;
  $('velo').classList.add('on');
});

$('velo').addEventListener('click', async (e) => {
  if (e.target === $('velo')) { $('velo').classList.remove('on'); return; }
  const b = e.target.closest('[data-annulla]');
  if (b) {
    if (!confirm('Annullare questa traduzione?')) return;
    await fetch('/api/cancel/'+b.dataset.annulla, {method:'POST'});
    $('velo').classList.remove('on'); chiave=''; carica();
  }
});

let deb=null;
qEl.addEventListener('input', ()=>{ clearTimeout(deb); deb=setTimeout(()=>{chiave='';carica();},250); });
$('filters').addEventListener('click', (e)=>{
  const c=e.target.closest('.chip'); if(!c) return;
